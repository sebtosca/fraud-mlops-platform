[project]
name = "fraud-core"
version = "0.1.0"
description = "Shared domain code for the fraud platform: config, features, contracts, jobs"
requires-python = "==3.13.*"
dependencies = [
    "boto3>=1.43.108",
    "pandas>=2.2,<3",
    "pandera[pandas]==0.33.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fraud"
